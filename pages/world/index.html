<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-row">
        <h1>Sensing World</h1>
        <button type="button" id="theme" aria-label="Night" title="Day or night (T)" data-now="light"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Spaces"></nav>
  </header>
  <section class="space-head" id="space-head"></section>
  <section class="work">
    <div class="stage">
      <div class="view" id="view">
        <canvas id="scene" aria-label="The space in 3D: click a room to go in; in a room, click a device, a sensor, a subject or an object to see the papers that read it; drag to turn, scroll to zoom"></canvas>
        <div class="labels" id="labels" role="group" aria-label="Rooms"></div>
        <div class="tip" id="tip" hidden></div>
        <button type="button" class="back-btn" id="back" hidden>← Back</button>
        <button type="button" class="step-btn prev" id="prev-space"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="nm"></span></button>
        <button type="button" class="step-btn next" id="next-space"><span class="nm"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <div class="hint" id="hint">Click a room to go in · ← → another space · drag to turn · scroll to zoom</div>
      </div>
      <div class="clock">
        <button id="play" type="button" aria-pressed="true">Pause</button>
        <label for="speed">Speed</label>
        <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </div>
    </div>
    <aside class="guide" id="guide" aria-live="polite" aria-label="Papers and elements"></aside>
  </section>
  <footer class="foot" id="foot"></footer>
